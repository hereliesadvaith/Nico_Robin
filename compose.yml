# n8n + Directus, each with its own Postgres.
#
# Both apps bind to 127.0.0.1, so they are reachable only from the host.
# Terminate TLS in a reverse proxy and forward to 127.0.0.1:5678 (n8n) and
# 127.0.0.1:8055 (Directus) — see README.md.
#
# All settings come from .env — copy .env.example to .env first.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.36.9
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_DOMAIN:?set N8N_DOMAIN in .env}
      - WEBHOOK_URL=${N8N_PUBLIC_URL:?set N8N_PUBLIC_URL in .env}/
      - N8N_EDITOR_BASE_URL=${N8N_PUBLIC_URL}/
      - N8N_PROXY_HOPS=1
      # Decrypts stored credentials. Must never change once workflows exist.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
      # Without pruning, execution history grows until the disk fills.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336          # hours (14 days)
      - GENERIC_TIMEZONE=${TZ:-Asia/Kolkata}
      - TZ=${TZ:-Asia/Kolkata}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-postgres:
        condition: service_healthy
    logging: *default-logging

  n8n-postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
    volumes:
      - n8n_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  directus:
    image: directus/directus:12.3.1
    container_name: directus
    restart: unless-stopped
    ports:
      - "127.0.0.1:8055:8055"
    environment:
      - PUBLIC_URL=${DIRECTUS_PUBLIC_URL:?set DIRECTUS_PUBLIC_URL in .env}
      - IP_TRUST_PROXY=1
      # KEY identifies this instance; SECRET signs tokens. Changing SECRET
      # logs everyone out.
      - KEY=${DIRECTUS_KEY:?set DIRECTUS_KEY in .env}
      - SECRET=${DIRECTUS_SECRET:?set DIRECTUS_SECRET in .env}
      - DB_CLIENT=pg
      - DB_HOST=directus-postgres
      - DB_PORT=5432
      - DB_DATABASE=directus
      - DB_USER=directus
      - DB_PASSWORD=${DIRECTUS_DB_PASSWORD:?set DIRECTUS_DB_PASSWORD in .env}
      # Creates the first admin, then ignored.
      - ADMIN_EMAIL=${DIRECTUS_ADMIN_EMAIL:?set DIRECTUS_ADMIN_EMAIL in .env}
      - ADMIN_PASSWORD=${DIRECTUS_ADMIN_PASSWORD:?set DIRECTUS_ADMIN_PASSWORD in .env}
      - TELEMETRY=false
      # Off by default upstream, which leaves /auth/login open to brute force.
      # Counted per IP, so IP_TRUST_PROXY above must stay set.
      - RATE_LIMITER_ENABLED=true
      - RATE_LIMITER_STORE=memory
      - RATE_LIMITER_POINTS=25
      - RATE_LIMITER_DURATION=1
      - TZ=${TZ:-Asia/Kolkata}
      - MCP_OAUTH_ENABLED=true
      - MCP_OAUTH_DCR_ENABLED=true
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    depends_on:
      directus-postgres:
        condition: service_healthy
    logging: *default-logging

  directus-postgres:
    image: postgres:16-alpine
    container_name: directus-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=directus
      - POSTGRES_USER=directus
      - POSTGRES_PASSWORD=${DIRECTUS_DB_PASSWORD:?set DIRECTUS_DB_PASSWORD in .env}
    volumes:
      - directus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus -d directus"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

volumes:
  n8n_data:
  n8n_pg_data:
  directus_uploads:
  directus_extensions:
  directus_pg_data:
